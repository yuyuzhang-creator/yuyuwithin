<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>English OS Mobile</title>
<style>
:root{--bg:#f7f4fb;--card:#fff;--ink:#24212a;--muted:#78717d;--line:#e9e1ee;--accent:#71558c;--soft:#eee6f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}
.app{max-width:680px;margin:auto;padding:20px 16px}.page{display:none}.page.active{display:block}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}h1{font-size:28px;line-height:1.15;margin:7px 0 8px}.sub{font-size:14px;color:var(--muted);line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 5px 18px rgba(70,50,80,.04)}
.metric{font-weight:800;font-size:24px;margin-top:4px}.label{font-size:11px;color:var(--muted)}h2{font-size:20px}
.btn{width:100%;border:0;border-radius:15px;padding:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:750}.secondary{background:var(--soft);color:var(--accent)}
textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:16px;padding:15px;font:inherit;font-size:16px;background:#fff;resize:none;outline:none}
.rec{margin-top:12px}.exp{font-size:18px;font-weight:800}.score{font-size:22px;font-weight:850}.meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#f1edf4;margin:8px 5px 0 0;font-size:11px}
.item{padding:14px 0;border-bottom:1px solid var(--line)}.progress{height:7px;border-radius:99px;background:#eee8f1;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:8px}.row .btn{flex:1}.answer{margin-top:12px;padding:13px;background:#f7f3fa;border-radius:14px;font-size:14px;line-height:1.5}.hidden{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bottom-inner{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:transparent;padding:9px 4px;color:#8a838e;font-size:11px;font-weight:650}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:var(--accent)}
.notice{font-size:12px;line-height:1.5;padding:11px 12px;background:#f0ebf5;border-radius:13px;color:#5f526b;margin-top:12px}
</style>
</head>
<body>
<main class="app">
<section id="home" class="page active">
<div class="eyebrow">PERSONAL ENGLISH OS</div><h1>把看到的英语，变成你会用的英语。</h1><p class="sub">每天只练最值得主动掌握的表达。</p>
<div class="cards"><div class="card"><div class="label">已收藏</div><div class="metric" id="saved">0</div></div><div class="card"><div class="label">待复习</div><div class="metric" id="due">0</div></div><div class="card"><div class="label">已掌握</div><div class="metric" id="mastered">0</div></div></div>
<div class="card"><div class="eyebrow">TODAY</div><h2>5 分钟主动调用</h2><p class="sub">目标不是“认识”，而是在真实场景里能自己说出来。</p><button class="btn" onclick="go('practice')">开始今天的练习</button></div>
</section>

<section id="capture" class="page">
<h1>输入素材</h1><p class="sub">粘贴工作邮件、聊天、字幕或你看到的好表达。</p>
<textarea id="source">Please find attached the CSC Exotic submission for March, including the revised version of the February submission and the new submissions for March.
Going forward, please loop me in on any CSC-related submissions.
Thank you for your support.</textarea>
<div style="height:10px"></div><button class="btn" onclick="extract()">帮我挑值得学的表达</button>
<div class="notice">当前是体验版，先用示例规则模拟 AI 提取，重点测试学习流程是否顺手。</div><div id="results"></div>
</section>

<section id="library" class="page"><h1>我的表达库</h1><p class="sub">只留下真正会在工作和生活里用到的表达。</p><div class="card" id="libraryList"></div></section>

<section id="practice" class="page"><h1>主动练习</h1><p class="sub">从“想得起来”逐渐走到“不提醒也会自然使用”。</p><div class="card" id="practiceBox"></div></section>
</main>

<nav class="bottom"><div class="bottom-inner">
<button class="nav active" data-page="home"><b>⌂</b>首页</button>
<button class="nav" data-page="capture"><b>＋</b>输入</button>
<button class="nav" data-page="library"><b>▤</b>表达库</button>
<button class="nav" data-page="practice"><b>◉</b>练习</button>
</div></nav>

<script>
const demo=[
{id:"loop",exp:"loop someone in on something",score:94,fn:"让某人持续参与 / 同步信息",reason:"非常适合跨团队协作、邮件和会议，而且与你的工作场景高度相关。",pattern:"loop + someone + in on + something",example:"Could you loop Alex in on the discussion?",stage:0,next:Date.now()},
{id:"forward",exp:"Going forward, ...",score:82,fn:"提出未来方向或后续安排",reason:"适合邮件、会议和 presentation，用于自然引出未来动作。",pattern:"Going forward, + future action",example:"Going forward, we'll review the results weekly.",stage:0,next:Date.now()}
];
let db=JSON.parse(localStorage.getItem("englishOSMobile")||"[]");
function save(){localStorage.setItem("englishOSMobile",JSON.stringify(db));render()}
function go(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===id));window.scrollTo(0,0);render()}
document.querySelectorAll(".nav").forEach(x=>x.onclick=()=>go(x.dataset.page));
function extract(){results.innerHTML='<h2 style="margin-top:22px">推荐学习 2 条</h2>'+demo.map(x=>`<div class="card rec"><div style="display:flex;justify-content:space-between;gap:10px"><div class="exp">${x.exp}</div><div class="score">${x.score}</div></div><div class="meta">${x.fn}</div><span class="tag">Learning Value ${x.score}/100</span><p style="font-size:14px;line-height:1.55">${x.reason}</p><button class="btn" onclick="add('${x.id}')">${db.some(a=>a.id===x.id)?'已收藏':'收藏并开始学习'}</button></div>`).join("")}
function add(id){let x=demo.find(a=>a.id===id);if(!db.some(a=>a.id===id))db.push({...x});save();go("library")}
function render(){saved.textContent=db.length;due.textContent=db.filter(x=>x.next<=Date.now()).length;mastered.textContent=db.filter(x=>x.stage>=5).length;
libraryList.innerHTML=db.length?db.map(x=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:8px"><div class="exp">${x.exp}</div><span class="tag">Stage ${x.stage}</span></div><div class="meta">${x.fn}</div><div style="font-size:14px;margin-top:9px"><b>Pattern</b><br>${x.pattern}</div><div class="progress"><i style="width:${x.stage/5*100}%"></i></div></div>`).join(""):'<div class="meta">还没有收藏。先去「输入」试一下示例邮件。</div>';practice()}
function practice(){if(!db.length){practiceBox.innerHTML='<div class="meta">先收藏一个表达，我才能给你出题。</div><div style="height:12px"></div><button class="btn" onclick="go(\'capture\')">去输入素材</button>';return}
let x=db.find(a=>a.next<=Date.now())||db[0];let p=[`先看表达：<b>${x.exp}</b><br><br>想一下你会在什么场景使用它？`,`不要照抄原句。请自己用 <b>${x.exp}</b> 写一句工作场景英文。`,`场景：同事正在和另一个团队推进项目，你希望之后的沟通也把你加入进来。你会怎么说？`,`换一个新的工作情景，自然使用 <b>${x.exp}</b>。`,`用 3–5 句英文讲一个工作项目，并把这个表达自然放进去。`,`最终测试：不显示目标表达，在适合的场景下自然调用它。`];
practiceBox.innerHTML=`<div class="eyebrow">STAGE ${x.stage}</div><h2>${p[Math.min(5,x.stage)]}</h2><textarea placeholder="直接在这里输入你的回答…"></textarea><div id="ref" class="answer hidden"><b>参考：</b><br>${x.example}</div><div style="height:10px"></div><button class="btn secondary" onclick="ref.classList.remove('hidden')">看参考表达</button><div style="height:9px"></div><div class="row"><button class="btn secondary" onclick="rate('${x.id}','fail')">没想起来</button><button class="btn secondary" onclick="rate('${x.id}','partial')">勉强</button><button class="btn" onclick="rate('${x.id}','pass')">自然说出</button></div>`}
function rate(id,r){let x=db.find(a=>a.id===id),d=86400000,g=[1,3,7,14,30,60];if(r==="pass")x.stage=Math.min(5,x.stage+1);if(r==="fail")x.stage=Math.max(0,x.stage-1);x.next=Date.now()+g[x.stage]*d;save()}
render()
</script>
</body></html>
